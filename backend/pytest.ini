[pytest]
# Run from backend/ directory: pytest -v
# testpaths tells pytest where to look for tests
testpaths = tests
# pythonpath adds backend/ itself to sys.path so "from main import app" resolves
pythonpath = .
# auto mode: pytest-asyncio detects async test functions automatically,
# no need for @pytest.mark.asyncio on every test.
asyncio_mode = auto
# Suppress deprecation warnings from third-party packages we don't control.
# gotrue: supabase-py's internal auth dependency — replaced by supabase_auth in a future release.
# PyPDF2: migrating to pypdf post-MVP (tracked in tech debt).
filterwarnings =
    ignore:The `gotrue` package is deprecated:DeprecationWarning
    ignore::DeprecationWarning:PyPDF2
